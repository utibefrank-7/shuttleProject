{% extends "admin_base.html" %}

{% block admin_content %}

<h1 class="text-3xl font-bold mb-8">
Admin Dashboard
</h1>

<div class="grid grid-cols-4 gap-6 mb-10">

<div class="bg-white shadow rounded-lg p-6">
<h3 class="text-gray-500">Total Drivers</h3>
<p class="text-3xl font-bold text-blue-600">
{{ total_drivers }}
</p>
</div>

<div class="bg-white shadow rounded-lg p-6">
<h3 class="text-gray-500">Pending Applications</h3>
<p class="text-3xl font-bold text-yellow-500">
{{ pending_applications }}
</p>
</div>

<div class="bg-white shadow rounded-lg p-6">
<h3 class="text-gray-500">Total Buses</h3>
<p class="text-3xl font-bold text-purple-600">
{{ total_buses }}
</p>
</div>

<div class="bg-white shadow rounded-lg p-6">
<h3 class="text-gray-500">Approved Buses</h3>
<p class="text-3xl font-bold text-green-600">
{{ approved_buses }}
</p>
</div>

<div class="bg-white shadow rounded-lg p-6">
<h3 class="text-gray-500">Rejected Buses</h3>
<p class="text-3xl font-bold text-red-700">
{{ rejected_buses }}
</p>
</div>

</div>

{% endblock %}
