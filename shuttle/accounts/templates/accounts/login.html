{% extends "base.html" %}

{% block title %}Login | Smart Shuttle{% endblock %}

{% block content %}
<section class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-lg">
  <h1 class="text-2xl font-bold text-gray-800 text-center">Login</h1>
  <p class="text-center text-gray-500 mt-2">Access your account to manage shuttle services</p>

  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
      Login
    </button>
  </form>

  <p class="text-center text-gray-500 mt-4">
    Don't have an account? <a href="{% url 'signup' %}" class="text-blue-600 hover:underline">Sign Up</a>
  </p>
</section>
{% endblock %}
