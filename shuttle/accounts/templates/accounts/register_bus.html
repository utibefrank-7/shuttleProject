<!DOCTYPE html>
<html>

<head>

<title>Register Vehicle</title>

<style>

body{
font-family: Arial;
background:#f4f6f8;
}

.container{

width:50%;
margin:auto;
margin-top:50px;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);

}

input{

width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;

}

button{

background:#007bff;
color:white;
padding:12px;
border:none;
cursor:pointer;
width:100%;

}

button:hover{

background:#0056b3;

}

</style>

</head>


<body>

<div class="container">

<h2>Register Vehicle</h2>

<form method="POST">

{% csrf_token %}

<div>

<label>Vehicle Name</label>

{{ form.vehicle_name }}

</div>


<div>

<label>Plate Number</label>

{{ form.plate_no }}

</div>


<div>

<label>Colour</label>

{{ form.colour }}

</div>


<div>

<label>Capacity</label>

{{ form.capacity }}

</div>

<button type="submit">

Submit Vehicle

</button>

</form>

</div>

</body>

</html>
