{% extends "driver_base.html" %}

{% block driver_content %}

<h1 class="text-3xl font-bold text-gray-800 mb-6">
Welcome, {{ request.user.username }} ({{ request.user.role }})
</h1>

<div class="bg-white shadow rounded-lg p-6">

  <h2 class="text-xl font-semibold text-gray-800 mb-4">
    Apply to Drive
  </h2>

{% if application %} <p class="text-gray-700">
Application Status: <strong class="text-blue-600">{{ application.status }}</strong> </p>
{% else %} <p class="text-gray-700">
You have not applied yet. <a href="{% url 'driver_application' %}" class="text-blue-600 hover:underline">
Apply Now </a> </p>
{% endif %}

</div>

{% endblock %}
