{% extends "owner_base.html" %}

{% block owner_content %}

<div class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl p-8">

<h2 class="text-2xl font-bold mb-6 text-gray-800">
Register New Vehicle
</h2>

<form method="POST" enctype="multipart/form-data" class="space-y-5">

{% csrf_token %}

<!-- Vehicle Name -->
<div>
<label class="block text-gray-600 mb-1">Vehicle Name</label>
{{ form.vehicle_name }}
</div>

<!-- Plate Number -->
<div>
<label class="block text-gray-600 mb-1">Plate Number</label>
{{ form.plate_no }}
</div>

<!-- Colour -->
<div>
<label class="block text-gray-600 mb-1">Colour</label>
{{ form.colour }}
</div>

<!-- Capacity -->
<div>
<label class="block text-gray-600 mb-1">Capacity</label>
{{ form.capacity }}
</div>

<!-- Image Upload -->
<div>
<label class="block text-gray-600 mb-1">Bus Image</label>
{{ form.image }}
</div>

<!-- BUTTONS -->
<div class="flex justify-between items-center pt-4">

<a href="{% url 'owner_dashboard' %}" 
   class="text-gray-500 hover:text-gray-700">
← Back
</a>

<button type="submit" 
        class="bg-blue-600 text-white px-6 py-2 rounded-lg shadow hover:bg-blue-700">
Register Bus
</button>

</div>

</form>

</div>

{% endblock %}
